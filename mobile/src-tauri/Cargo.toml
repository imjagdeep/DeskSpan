[package]
name = "deskspan-screen"
version = "0.1.0"
description = "DeskSpan Screen: use this phone or tablet as a screen for your computer"
authors = ["Jagdeep Sandhu"]
license = "MIT"
edition = "2021"

[lib]
name = "deskspan_screen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-barcode-scanner = "2"
