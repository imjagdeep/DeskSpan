<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>DeskSpan screen</title>
  </head>
  <body>
    <video id="screen" playsinline autoplay muted></video>

    <main id="panel" class="panel" aria-live="polite">
      <img class="logo" src="/favicon.png" alt="" width="72" height="72" />
      <h1 id="title">Connecting…</h1>
      <p id="text" class="muted"></p>

      <form id="code-form" class="code-form" hidden>
        <label for="code">Code shown in DeskSpan on the computer</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="000000" required />
        <label for="name">Name for this device</label>
        <input id="name" maxlength="60" required />
        <button type="submit" class="primary">Connect</button>
      </form>

      <div id="home" class="home" hidden>
        <button id="go-screen" type="button" class="tile">
          <strong>Use as screen</strong>
          <span>An extra display (or a copy) of the computer</span>
        </button>
        <button id="go-send" type="button" class="tile">
          <strong>Send files</strong>
          <span>Photos and files, straight to its Downloads</span>
        </button>
      </div>

      <div id="send" class="send" hidden>
        <label class="tile">
          <strong>Choose files</strong>
          <span>Photos, videos, documents…</span>
          <input id="files" type="file" multiple hidden />
        </label>
        <label class="tile">
          <strong>Take a photo</strong>
          <span>With this device's camera</span>
          <input id="camera" type="file" accept="image/*" capture="environment" hidden />
        </label>
        <ul id="send-list" class="send-list"></ul>
        <button id="send-back" type="button" class="link">Back</button>
      </div>

      <div id="actions" class="actions" hidden>
        <button id="retry" type="button" class="primary">Try again</button>
      </div>
    </main>

    <div id="fs-prompt" class="fs-prompt" hidden>
      <button id="fs-go" type="button" class="primary">Tap for full screen</button>
      <button id="fs-skip" type="button" class="link">Not now</button>
    </div>

    <div id="bar" class="bar" hidden>
      <span id="bar-host" class="bar-host"></span>
      <span id="stats" class="bar-stats" title="Frames a second, and how far behind the computer the picture is"></span>
      <button id="sound" type="button" hidden>Sound on</button>
      <button id="full" type="button">Full screen</button>
      <button id="home-btn" type="button">Home</button>
      <button id="leave" type="button">Disconnect</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
