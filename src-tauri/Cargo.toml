[package]
name = "deskspan"
version = "0.1.0"
description = "Use a phone, tablet or another computer as a second screen"
license = "MIT"
edition = "2021"

[lib]
# `_lib` keeps the lib name distinct from the bin on Windows (cargo#8519).
name = "deskspan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# The local server the receivers talk to (server.rs): page, pairing, signalling.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"
# The picture: screen capture, H.264 (Cisco's OpenH264, downloaded and
# hash-checked at first use, see h264lib.rs) and WebRTC (pure-Rust crypto).
xcap = "0.9"
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
bzip2 = "0.6"
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
sha2 = "0.10"
# Optional DeskLab account (account.rs): HTTPS with the same rustls + ring the
# updater uses, the OS keychain for the sign-in, and the computer's name.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = "4"
gethostname = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
